apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    helm.sh/chart: opentelemetry-demo-0.41.0
    
    opentelemetry.io/name: agent
    
    app.kubernetes.io/version: "3.0.0"
    app.kubernetes.io/component: agent
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      
      opentelemetry.io/name: agent
  template:
    metadata:
      labels:
        
        opentelemetry.io/name: agent
        
        app.kubernetes.io/version: "3.0.0"
        app.kubernetes.io/component: agent
        app.kubernetes.io/name: agent
      annotations:
        resource.opentelemetry.io/service.namespace: opentelemetry-demo
    spec:
      serviceAccountName: otel-demo
      containers:
        - name: agent
          image: 'example/agent:check'
          imagePullPolicy: IfNotPresent
          ports:
            
            - containerPort: 8010
              name: service
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: otel-collector
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: AGENT_PORT
              value: "8010"
            - name: AGENT_ENDPOINT
              value: agent
            - name: GRAPH_RECURSION_LIMIT
              value: "25"
            - name: MCP_ENDPOINT
              value: mcp
            - name: MCP_PORT
              value: "8011"
            - name: MCP_ENABLED
              value: "True"
            - name: LLM_BASE_URL
              value: https://llm.example/v1
            - name: LLM_MODEL
              value: example-model
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  key: API_KEY
                  name: llm-credentials
                  optional: true
            - name: OPENAI_API_KEY
              value: $(API_KEY)
            - name: USE_VCR
              value: "False"
            - name: VCR_MATCH_THRESHOLD
              value: "0.85"
            - name: LLM_TLS_VERIFY
              value: "True"
            - name: APPLICATION_ENDPOINT
              value: frontend:8080
            - name: TRACELOOP_BASE_URL
              value: http://$(OTEL_COLLECTOR_NAME):4318
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: AGENT_BIND
              value: 0.0.0.0
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4318
            - name: LANGFUSE_BASE_URL
              valueFrom:
                secretKeyRef:
                  key: LANGFUSE_BASE_URL
                  name: langfuse-credentials
                  optional: true
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  key: LANGFUSE_PUBLIC_KEY
                  name: langfuse-credentials
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: LANGFUSE_SECRET_KEY
                  name: langfuse-credentials
                  optional: true
            - name: AGENT_MODE
              value: live
            - name: LANGFUSE_PROMPT_LABEL
              value: production
            - name: LANGFUSE_PROJECT_ID
              value: example-project
            - name: LANGFUSE_PUBLIC_URL
              value: https://langfuse.example
            - name: CLICKSTACK_TRACE_URL_TEMPLATE
              value: https://clickstack.example/search?trace={trace_id}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.version=3.0.0,service.criticality=low
          resources:
            limits:
              memory: 750Mi
          volumeMounts:
            - mountPath: /app/fixtures/vcr_cassettes
              name: agent-fixtures
      volumes:
        - configMap:
            name: agent-fixtures
          name: agent-fixtures
