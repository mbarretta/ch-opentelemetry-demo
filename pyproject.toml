[project]
name = "ch-opentelemetry-demo"
version = "0.1.0"
description = "OpenTelemetry Astronomy Shop with correlated ClickStack and Langfuse telemetry, deployable to Docker Compose or EKS"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".runtime/python"]

[tool.ruff]
target-version = "py314"
line-length = 100
# The trees ruff lints, `launcher` among them since the CLI moved out of scripts/demo.py. The
# verification command names the same four, so a bare `ruff check` covers the same files.
include = ["concierge/**/*.py", "launcher/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
